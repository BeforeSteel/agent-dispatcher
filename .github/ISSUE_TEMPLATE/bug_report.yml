name: Bug report
description: Something does not work as described in the README.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.
        **Security vulnerabilities must not be reported here** — use the private form described in SECURITY.md.
        Before posting logs or screenshots, remove personal data: real paths, IP addresses, host names, and tokens.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Web dashboard
        - CLI
        - Discovery (scan and import)
        - systemd integration
        - Docker integration
        - System and GPU statistics
        - Translations
        - Installation
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `agents add ...`
        2. Run `agents start my-app`
        3. ...
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Agent Dispatcher version
      description: Output of `git rev-parse --short HEAD` in your checkout.
      placeholder: a938f89
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Linux distribution
      placeholder: Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      description: Output of `.venv/bin/python --version`.
      placeholder: Python 3.12.3
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      description: Only for dashboard problems.
      placeholder: Firefox 131
  - type: textarea
    id: logs
    attributes:
      label: Relevant output or logs
      description: Terminal output, `agents logs <app-id>` output, or browser console errors. This field is formatted as code automatically.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed personal data (paths, IP addresses, host names, tokens) from everything I posted.
          required: true
